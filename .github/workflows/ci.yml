name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native Wayland build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            bubblewrap \
            busybox-static
      - name: Verify native dependencies
        run: |
          pkg-config --modversion wayland-client
          pkg-config --modversion xkbcommon
          bwrap --version
          busybox --help >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prepare minimal Bubblewrap test rootfs
        run: |
          rootfs="$RUNNER_TEMP/bubbleterm-rootfs"
          mkdir -p "$rootfs/bin"
          install -m 0755 "$(command -v busybox)" "$rootfs/bin/busybox"
          "$rootfs/bin/busybox" --install -s "$rootfs/bin"
          test -x "$rootfs/bin/sh"
          echo "BUBBLETERM_TEST_BWRAP_ROOTFS=$rootfs" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --workspace
