[package]
name = "bubbleterm-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
nix = { version = "0.29", features = ["poll"] }
bubbleterm-pty = { path = "../bubbleterm-pty" }
bubbleterm-vt = { path = "../bubbleterm-vt" }
portable-pty = "0.9.0"
tempfile = "3.10"
font8x8 = "0.3.1"
unicode-normalization = "0.1.24"
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin", "unicode-latin-1-supplement", "unicode-latin-extended-a", "unicode-specials"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
xkbcommon = "0.8"

[lints]
workspace = true
